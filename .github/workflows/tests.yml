name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # PhpSpreadsheet(Excel 导入导出) 必需扩展：gd/zip/xmlreader/xmlwriter/ctype/filter/iconv/libxml/simplexml/zlib
          extensions: mbstring, dom, fileinfo, gd, ctype, filter, iconv, libxml, simplexml, xml, xmlreader, xmlwriter, zip, zlib, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Diagnostic info
        run: |
          php -v
          php -m | grep -iE 'zip|gd|pdo_sqlite' || true
          node -v
          npm -v

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: php artisan test
